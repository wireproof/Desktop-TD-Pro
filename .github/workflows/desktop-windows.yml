name: Windows desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build portable EXE
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY='false'
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $env:ELECTRON_ENABLE_LOGGING='1'
          $exe = (Resolve-Path 'dist/win-unpacked/Desktop TD.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($process.ExitCode)" }
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-TD-Windows-x64
          path: desktop/dist/Desktop-TD-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7
