<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151b18}body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#game{width:min(100%,calc(100dvh * 1.333333));height:min(100%,calc(100vw * .75));background:#111}ruffle-player{width:100%;height:100%;display:block}#message{position:absolute;bottom:5px;color:#ddd;font:12px system-ui;pointer-events:none}</style><script src="ruffle.js"></script></head><body><div id="game"></div><div id="message">Loading Desktop TD Pro…</div><script>window.addEventListener('load',async()=>{try{let p=window.RufflePlayer.newest().createPlayer();document.querySelector('#game').appendChild(p);await p.ruffle().load({url:'game.swf',autoplay:'on',unmuteOverlay:'visible',allowNetworking:'none',openUrlMode:'deny',scale:'showAll',letterbox:'on'});window.webkit?.messageHandlers?.gameStatus?.postMessage('SWF loaded');document.querySelector('#message').remove()}catch(e){window.webkit?.messageHandlers?.gameStatus?.postMessage('Load failed: '+e);document.querySelector('#message').textContent='Game could not load: '+e}})</script></body></html>
