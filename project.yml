name: DesktopTDPro
options:
  bundleIdPrefix: com.wireproof
  deploymentTarget:
    iOS: '16.0'
targets:
  DesktopTDPro:
    type: application
    platform: iOS
    sources:
      - path: app
        excludes: [Resources/Web, Info.plist]
      - path: app/Resources/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireproof.desktoptdpro
        PRODUCT_NAME: Desktop TD Pro
        DEVELOPMENT_TEAM: KTV9W3H439
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: app/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
